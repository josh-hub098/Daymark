<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#203c33">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon.svg">
  <title>Daymark | To-Do + Habit Tracker</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #203c33;
      --ink-soft: #527067;
      --paper: #f3f4ee;
      --surface: #fffefa;
      --line: #e5e8df;
      --lime: #d9ed82;
      --coral: #ef8c70;
      --blue: #a8c8dc;
      --muted: #8d9b92;
      --shadow: 0 16px 38px rgba(32, 60, 51, .07);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      font-synthesis: none;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --ink: #e7eee8;
      --ink-soft: #b2c2b7;
      --paper: #17201b;
      --surface: #202b24;
      --line: #35443a;
      --lime: #d9ed82;
      --coral: #f39a7d;
      --blue: #8bb8c4;
      --muted: #9aa99e;
      --shadow: 0 16px 38px rgba(0, 0, 0, .22);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--paper); color: var(--ink); }
    button, input, select { font: inherit; }
    button { color: inherit; }
    .app-shell { min-height: 100vh; display: grid; grid-template-columns: 248px minmax(0, 1fr); }
    .sidebar { background: var(--ink); color: #f5f6ef; padding: 28px 18px 22px; display: flex; flex-direction: column; min-height: 100vh; }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 12px; font-family: Georgia, serif; font-size: 23px; letter-spacing: 0; }
    .brand-mark { display: grid; place-items: center; width: 34px; height: 34px; background: var(--lime); color: var(--ink); border-radius: 11px 11px 11px 3px; font: bold 19px Georgia, serif; }
    .workspace-label { margin: 44px 12px 11px; color: #9bb0a4; font-size: 10px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; }
    .nav-list { display: grid; gap: 5px; }
    .nav-item { display: flex; align-items: center; gap: 13px; width: 100%; min-height: 45px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: #bdc9c1; text-align: left; cursor: pointer; font-size: 13px; transition: background .18s ease, color .18s ease; }
    .nav-item:hover { color: #fff; background: rgba(255,255,255,.08); }
    .nav-item[aria-current="page"] { color: var(--ink); background: var(--lime); font-weight: 700; }
    .nav-glyph { width: 19px; text-align: center; font-size: 17px; }
    .sidebar-bottom { margin-top: auto; padding: 18px 12px 4px; border-top: 1px solid rgba(255,255,255,.13); color: #b6c5bc; font-size: 12px; line-height: 1.55; }
    .sidebar-bottom strong { display: block; margin-bottom: 4px; color: #fff; font-family: Georgia, serif; font-size: 16px; font-weight: 400; }
    .main-area { min-width: 0; padding: 0 clamp(20px, 4vw, 56px) 56px; }
    .topbar { height: 78px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .crumb { color: var(--ink-soft); font-size: 12px; }
    .today-date { display: flex; align-items: center; gap: 9px; color: var(--ink-soft); font-size: 12px; }
    .date-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--coral); }
    .content { max-width: 1280px; margin: 0 auto; padding-top: 36px; }
    .welcome-row { display: flex; align-items: end; justify-content: space-between; gap: 22px; margin-bottom: 27px; }
    .eyebrow { margin: 0 0 9px; color: #7c8e82; font-size: 10px; font-weight: 700; letter-spacing: 1.35px; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 8px; font: 400 clamp(30px, 4vw, 43px)/1.1 Georgia, serif; letter-spacing: 0; }
    .welcome-copy { margin: 0; color: var(--ink-soft); font-size: 13px; }
    .primary-button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 16px; border: 0; border-radius: 7px; background: var(--ink); color: #fff; cursor: pointer; font-size: 12px; font-weight: 700; transition: transform .15s ease, background .15s ease; }
    .primary-button:hover { transform: translateY(-1px); background: #31574a; }
    .stats-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px; margin-bottom: 23px; }
    .stat-card { min-height: 115px; padding: 18px 20px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
    .stat-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; color: var(--ink-soft); font-size: 11px; }
    .stat-symbol { display: grid; place-items: center; width: 27px; height: 27px; border-radius: 8px; background: #eff3e4; color: var(--ink); font-size: 14px; }
    .stat-value { font: 400 26px/1 Georgia, serif; }
    .stat-value small { color: var(--muted); font: 400 12px "Trebuchet MS", "Segoe UI", sans-serif; }
    .stat-note { float: right; margin-top: 7px; color: #87968d; font-size: 10px; }
    .dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(280px, .9fr); gap: 17px; align-items: start; }
    .column-stack { display: grid; gap: 17px; min-width: 0; }
    .panel { min-width: 0; padding: 21px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
    .panel-heading { display: flex; align-items: start; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .panel-heading h2 { margin: 0 0 5px; font: 400 20px/1.15 Georgia, serif; }
    .panel-heading p { margin: 0; color: var(--muted); font-size: 11px; }
    .text-button { padding: 4px 0; border: 0; background: transparent; color: #526f63; cursor: pointer; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .text-button:hover { color: #203c33; text-decoration: underline; }
    .progress-panel { display: flex; align-items: center; gap: 20px; min-height: 178px; background: #e8efcf; border-color: #e0e8c2; }
    .progress-ring { flex: 0 0 103px; display: grid; place-items: center; width: 103px; aspect-ratio: 1; border-radius: 50%; background: conic-gradient(var(--ink) var(--progress), rgba(32,60,51,.12) 0); position: relative; }
    .progress-ring::before { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: #e8efcf; }
    .progress-number { position: relative; font: 400 26px Georgia, serif; }
    .progress-copy h2 { margin-bottom: 7px; font: 400 20px Georgia, serif; }
    .progress-copy p { max-width: 260px; margin: 0; color: #607466; font-size: 11px; line-height: 1.5; }
    .item-list { display: grid; }
    .task-row, .habit-row { display: grid; grid-template-columns: 22px minmax(0,1fr) auto; align-items: center; gap: 11px; min-height: 57px; border-top: 1px solid #edf0e8; }
    .task-row:first-child, .habit-row:first-child { border-top: 0; }
    .check-button { display: grid; place-items: center; width: 20px; height: 20px; padding: 0; border: 1.5px solid #becbc0; border-radius: 6px; background: transparent; cursor: pointer; color: transparent; font-size: 12px; }
    .check-button:hover { border-color: var(--ink); }
    .check-button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: white; }
    .item-title { overflow: hidden; color: var(--ink); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .is-complete .item-title { color: #97a29a; text-decoration: line-through; }
    .item-meta { margin-top: 4px; color: #98a39b; font-size: 10px; }
    .task-tag { padding: 5px 8px; border-radius: 4px; background: #f2f4ed; color: #77867d; font-size: 9px; white-space: nowrap; }
    .habit-main { display: flex; min-width: 0; align-items: center; gap: 10px; }
    .habit-mark { flex: 0 0 31px; display: grid; place-items: center; width: 31px; height: 31px; border-radius: 9px; background: var(--habit-tint, #e8efcf); color: var(--ink); font-size: 15px; }
    .streak { display: flex; align-items: center; gap: 4px; color: #73857a; font-size: 10px; white-space: nowrap; }
    .empty-state { padding: 24px 10px; color: var(--muted); text-align: center; font-size: 12px; }
    .quick-form { display: flex; gap: 8px; margin-top: 14px; }
    .field { width: 100%; min-width: 0; min-height: 40px; padding: 0 11px; border: 1px solid var(--line); border-radius: 6px; outline: 0; background: #fff; color: var(--ink); font-size: 12px; }
    .field:focus { border-color: #809c81; box-shadow: 0 0 0 3px rgba(128,156,129,.15); }
    .add-button { flex: 0 0 40px; width: 40px; height: 40px; border: 0; border-radius: 6px; background: var(--lime); cursor: pointer; font-size: 20px; }
    .week-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; margin: 17px 0 10px; }
    .day-cell { display: grid; justify-items: center; gap: 8px; color: #849188; font-size: 9px; }
    .day-track { display: flex; align-items: end; width: 100%; height: 61px; padding: 5px; border-radius: 5px; background: #f1f3ec; }
    .day-fill { width: 100%; min-height: 4px; border-radius: 3px; background: var(--blue); }
    .day-cell.today .day-track { outline: 1px solid #afc36e; background: #f6f8ec; }
    .day-cell.today { color: var(--ink); font-weight: 700; }
    .habit-form { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; margin-bottom: 10px; }
    .view-intro { margin-bottom: 22px; }
    .view-intro h1 { margin-bottom: 9px; }
    .view-intro p { margin: 0; color: var(--ink-soft); font-size: 13px; }
    .wide-panel { margin-top: 18px; }
    .insight-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 14px; }
    .insight-tile { padding: 17px; border-radius: 7px; background: #f4f5ef; }
    .insight-tile span { display: block; margin-bottom: 10px; color: #7e8c82; font-size: 10px; }
    .insight-tile strong { font: 400 26px Georgia, serif; }
    .delete-button { border: 0; background: transparent; color: #a3ada5; cursor: pointer; font-size: 17px; line-height: 1; }
    .delete-button:hover { color: #b54d3e; }
    .toast { position: fixed; right: 22px; bottom: 22px; z-index: 5; padding: 12px 16px; border-radius: 6px; background: var(--ink); color: #fff; box-shadow: var(--shadow); font-size: 12px; animation: rise .2s ease-out; }
    :root[data-theme="dark"] .sidebar { background: #101813; }
    :root[data-theme="dark"] .brand-mark,
    :root[data-theme="dark"] .nav-item[aria-current="page"],
    :root[data-theme="dark"] .primary-button,
    :root[data-theme="dark"] .check-button[aria-pressed="true"] { color: #203c33; }
    :root[data-theme="dark"] .primary-button { background: var(--lime); }
    :root[data-theme="dark"] .progress-panel { background: #344332; border-color: #4a5a43; }
    :root[data-theme="dark"] .progress-ring { background: conic-gradient(var(--lime) var(--progress), rgba(217,237,130,.14) 0); }
    :root[data-theme="dark"] .progress-ring::before { background: #344332; }
    :root[data-theme="dark"] .progress-copy p { color: #d0d8c7; }
    :root[data-theme="dark"] .field { background: #17221b; color: var(--ink); }
    :root[data-theme="dark"] .task-tag,
    :root[data-theme="dark"] .insight-tile { background: #2a372f; color: #c0cdc3; }
    :root[data-theme="dark"] .stat-symbol,
    :root[data-theme="dark"] .day-track { background: #303d34; color: var(--ink); }
    :root[data-theme="dark"] .toast { background: var(--lime); color: #203c33; }
    :root[data-theme="dark"] .day-cell.today .day-track { background: #3a4734; }
    :root[data-theme="dark"] .habit-mark { color: #203c33; }
    #app-shell[hidden], #auth-root[hidden] { display: none !important; }
    .auth-page { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 28px; background: radial-gradient(ellipse at 12% 90%, rgba(217,237,130,.22), transparent 38%), var(--paper); }
    .auth-card { display: grid; grid-template-columns: minmax(280px,.9fr) minmax(340px,1.1fr); width: min(920px, 100%); min-height: min(560px, calc(100svh - 56px)); overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); box-shadow: var(--shadow); }
    .auth-brand-panel { display: flex; flex-direction: column; justify-content: space-between; padding: 34px; background: var(--ink); color: #f5f6ef; }
    :root[data-theme="dark"] .auth-brand-panel { background: #101813; }
    .auth-brand-panel .brand { padding: 0; }
    .auth-brand-panel .brand-mark { color: #203c33; }
    .auth-promise { max-width: 330px; }
    .auth-promise .eyebrow { color: #c1d0b6; }
    .auth-promise h1 { max-width: 320px; font-size: 38px; }
    .auth-promise p:last-child { max-width: 285px; margin: 0; color: #c1d0c6; font-size: 13px; line-height: 1.6; }
    .auth-footnote { margin: 0; color: #c1d0c6; font-size: 11px; line-height: 1.5; }
    .auth-form-panel { align-self: center; padding: 38px clamp(24px, 5vw, 58px); }
    .auth-form-panel h2 { margin: 0 0 9px; font: 400 29px Georgia, serif; }
    .auth-subtitle { margin: 0 0 22px; color: var(--ink-soft); font-size: 12px; line-height: 1.55; }
    .auth-fields { display: grid; gap: 14px; }
    .auth-field, .setting-field { display: grid; gap: 7px; color: var(--ink-soft); font-size: 12px; font-weight: 700; }
    .auth-field .field, .setting-field .field { font-weight: 400; }
    .auth-field .field { min-height: 46px; }
    .password-control { position: relative; display: flex; align-items: center; }
    .password-control .field { padding-right: 58px; }
    .password-visibility { position: absolute; right: 8px; padding: 5px 4px; border: 0; background: transparent; color: var(--ink-soft); cursor: pointer; font-size: 10px; font-weight: 700; }
    .password-visibility:focus-visible { outline: 2px solid #809c81; outline-offset: 1px; border-radius: 3px; }
    .auth-submit { width: 100%; min-height: 46px; margin-top: 17px; }
    .auth-switch { margin: 17px 0 0; color: var(--ink-soft); font-size: 11px; text-align: center; }
    .primary-button:focus-visible, .text-button:focus-visible, .nav-item:focus-visible, .profile-button:focus-visible { outline: 2px solid var(--coral); outline-offset: 3px; }
    .auth-message { margin: 12px 0 0; padding: 10px 12px; border-radius: 6px; background: #f8e6df; color: #843c2e; font-size: 11px; line-height: 1.45; }
    :root[data-theme="dark"] .auth-message { background: #4b302a; color: #ffd2c4; }
    .topbar-actions { display: flex; align-items: center; gap: 16px; }
    .profile-button { display: grid; place-items: center; width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 50%; background: var(--lime); color: #203c33; cursor: pointer; font: 700 13px Georgia, serif; }
    .profile-button:hover { outline: 3px solid rgba(217,237,130,.28); }
    .settings-form { display: grid; gap: 0; }
    .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 0; border-top: 1px solid var(--line); }
    .setting-row:first-child { border-top: 0; padding-top: 0; }
    .setting-copy strong { display: block; margin-bottom: 4px; color: var(--ink); font-size: 12px; }
    .setting-copy span { display: block; max-width: 470px; color: var(--muted); font-size: 10px; line-height: 1.5; }
    .setting-select, .setting-time { width: 180px; max-width: 42vw; }
    .setting-toggle { flex: 0 0 auto; width: 19px; height: 19px; accent-color: #426b55; }
    .settings-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 18px; }
    .profile-avatar { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 50%; background: var(--lime); color: #203c33; font: 700 20px Georgia, serif; }
    .profile-head { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
    .profile-head h2 { margin: 0 0 4px; font: 400 21px Georgia, serif; }
    .profile-head p { margin: 0; color: var(--muted); font-size: 11px; }
    .profile-details { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
    .profile-detail { padding: 14px; border-radius: 6px; background: var(--paper); }
    .profile-detail span { display: block; margin-bottom: 7px; color: var(--muted); font-size: 10px; }
    .profile-detail strong { color: var(--ink); font-size: 12px; overflow-wrap: anywhere; }
    .notice-copy { color: var(--muted); font-size: 10px; line-height: 1.55; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 940px) {
      .app-shell { grid-template-columns: 205px minmax(0,1fr); }
      .main-area { padding-inline: 24px; }
      .dashboard-grid { grid-template-columns: minmax(0,1.25fr) minmax(250px,.85fr); gap: 12px; }
      .panel { padding: 17px; }
      .progress-panel { gap: 13px; }
      .progress-ring { flex-basis: 84px; width: 84px; }
    }
    @media (max-width: 720px) {
      .app-shell { display: block; padding-bottom: 69px; }
      .sidebar { position: fixed; z-index: 4; inset: auto 0 0; min-height: 0; height: 64px; padding: 6px 10px; border-top: 1px solid rgba(255,255,255,.14); }
      .brand, .workspace-label, .sidebar-bottom { display: none; }
      .nav-list { height: 100%; grid-template-columns: repeat(5,1fr); gap: 4px; }
      .nav-item { min-height: 50px; padding: 4px 2px; flex-direction: column; justify-content: center; gap: 3px; border-radius: 6px; font-size: 9px; }
      .nav-glyph { font-size: 16px; }
      .main-area { padding: 0 17px 28px; }
      .topbar { height: 62px; }
      .content { padding-top: 27px; }
      .welcome-row { align-items: start; flex-direction: column; gap: 15px; }
      .welcome-row .primary-button { align-self: stretch; }
      .stats-grid { gap: 7px; }
      .stat-card { min-height: 98px; padding: 12px 10px; }
      .stat-top { align-items: start; margin-bottom: 11px; font-size: 9px; }
      .stat-symbol { display: none; }
      .stat-value { font-size: 22px; }
      .stat-note { display: none; }
      .dashboard-grid { grid-template-columns: 1fr; }
      .column-stack { gap: 12px; }
      .progress-panel { min-height: 148px; }
      .progress-ring { flex-basis: 90px; width: 90px; }
      .panel { padding: 17px; }
      .view-intro { margin-bottom: 17px; }
      .habit-form { grid-template-columns: minmax(0,1fr) 42px; }
      .auth-page { padding: 14px 12px; }
      .auth-card { grid-template-columns: 1fr; min-height: 0; }
      .auth-brand-panel { display: flex; flex-direction: row; align-items: center; justify-content: flex-start; min-height: 68px; padding: 14px 20px; }
      .auth-brand-panel .brand { display: flex; }
      .auth-brand-panel .auth-promise, .auth-brand-panel .auth-footnote { display: none; }
      .auth-brand-panel .brand { font-size: 20px; }
      .auth-form-panel { padding: 24px 20px 28px; }
      .setting-row { align-items: start; }
      .setting-select, .setting-time { width: 145px; }
      .topbar-actions { gap: 10px; }
      .today-date { font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div id="auth-root"></div>
  <div class="app-shell" id="app-shell" hidden>
    <aside class="sidebar" aria-label="Main navigation">
      <div class="brand"><span class="brand-mark">d.</span><span>daymark</span></div>
      <div class="workspace-label">Your space</div>
      <nav class="nav-list">
        <button class="nav-item" data-view="today" aria-current="page"><span class="nav-glyph">◷</span><span>Today</span></button>
        <button class="nav-item" data-view="tasks"><span class="nav-glyph">☷</span><span>Tasks</span></button>
        <button class="nav-item" data-view="habits"><span class="nav-glyph">✳</span><span>Habits</span></button>
        <button class="nav-item" data-view="insights"><span class="nav-glyph">↗</span><span>Insights</span></button>
        <button class="nav-item" data-view="settings"><span class="nav-glyph">⚙</span><span>Settings</span></button>
      </nav>
      <div class="sidebar-bottom"><strong>Small steps count.</strong>Keep showing up for the things you care about.</div>
    </aside>
    <div class="main-area">
      <header class="topbar"><div class="crumb" id="breadcrumb">Your space / Today</div><div class="topbar-actions"><div class="today-date"><span class="date-dot"></span><span id="date-label"></span></div><button class="profile-button" data-view="profile" id="profile-button" aria-label="Open profile" title="Profile">D</button></div></header>
      <main class="content" id="content" aria-live="polite"></main>
    </div>
  </div>
  <script>
    const STORE_KEY = "daymark-v1";
    const USERS_KEY = "daymark-users-v1";
    const SESSION_DATA_PREFIX = "daymark-profile-data-v1:";
    const DEFAULT_SETTINGS = { theme: "light", notificationsEnabled: false, taskReminders: true, quoteNotifications: true, quoteEveryHours: 6, reminderTime: "18:00", lastQuoteAt: Date.now(), lastReminderDate: "" };
    const QUOTES = ["Small steps still move you forward.", "You don't have to finish everything today; just keep your promise to begin.", "Consistency is built one ordinary day at a time.", "Progress counts, even when it is quiet.", "Make the next choice a kind one."];
    const today = localDate(new Date());
    const starterData = { tasks: [], habits: [] };
    let users = loadUsers();
    let currentUser = null;
    let state = structuredClone(starterData);
    let authMode = Object.keys(users).length ? "login" : "register";
    let authMessage = "";
    let currentView = "today";
    let toastTimer;
    let reminderTimer;

    function localDate(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

      return `<section class="view-intro"><p class="eyebrow">Notice the good</p><h1>Your progress</h1><p>A snapshot of the effort you've put in lately.</p></section>
        <section class="panel"><div class="panel-heading"><div><h2>At a glance</h2><p>Your current momentum</p></div></div><div class="insight-grid"><div class="insight-tile"><span>Today's completion</span><strong>${todayRate}%</strong></div><div class="insight-tile"><span>Best active streak</span><strong>${best} day${best === 1 ? "" : "s"}</strong></div><div class="insight-tile"><span>Habit check-ins this week</span><strong>${weekChecks}</strong></div><div class="insight-tile"><span>Habits in your routine</span><strong>${state.habits.length}</strong></div></div></section>
        <section class="panel wide-panel"><div class="panel-heading"><div><h2>Weekly habit rhythm</h2><p>Share of habits checked off each day</p></div></div><div class="week-strip">${weekBars()}</div></section>`;
    }
    function renderSettings() { return settingsPanel(); }
    function render() {
      if (!currentUser) { renderAuth(); return; }
      document.getElementById("auth-root").hidden = true;
      document.getElementById("app-shell").hidden = false;
      applyTheme(currentUser.settings.theme);
      const date = new Date();
      document.getElementById("date-label").textContent = date.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
      document.getElementById("profile-button").textContent = initials(currentUser.fullName);
      document.getElementById("breadcrumb").textContent = `Your space / ${currentView[0].toUpperCase()}${currentView.slice(1)}`;
      document.querySelectorAll(".nav-item").forEach(button => button.setAttribute("aria-current", button.dataset.view === currentView ? "page" : "false"));
      const views = { today: renderToday, tasks: renderTasks, habits: renderHabits, insights: renderInsights, settings: renderSettings, profile: renderProfile };
      document.getElementById("content").innerHTML = views[currentView]();
    }
    function addTask(title) {
      state.tasks.unshift({ id: crypto.randomUUID(), title: title.trim(), category: "Personal", done: false });
      saveState(); render(); showToast("Task added to your day.");
    }
    function addHabit(name) {
      state.habits.push({ id: crypto.randomUUID(), name: name.trim(), symbol: "✳", tint: "#e7ebc9", history: [] });
      saveState(); render(); showToast("A new habit is ready when you are.");
    }
    document.addEventListener("click", async event => {
      const passwordToggle = event.target.closest("[data-password-toggle]");
      if (passwordToggle) {
        const input = passwordToggle.parentElement.querySelector("input");
        const visible = input.type === "password";
        input.type = visible ? "text" : "password";
        passwordToggle.textContent = visible ? "Hide" : "Show";
        passwordToggle.setAttribute("aria-pressed", String(visible));
        passwordToggle.setAttribute("aria-label", `${visible ? "Hide" : "Show"} ${passwordToggle.dataset.label}`);
        return;
      }
      const authModeButton = event.target.closest("[data-auth-mode]");
      if (authModeButton) { authMode = authModeButton.dataset.authMode; authMessage = ""; renderAuth(); return; }
      const viewButton = event.target.closest("[data-view]");
      if (viewButton) { currentView = viewButton.dataset.view; render(); return; }
      const actionButton = event.target.closest("[data-action]");
      if (!actionButton) return;
      const { action, id } = actionButton.dataset;
      if (action === "request-notifications") {
        if (!("Notification" in window)) { showToast("This browser does not support system notifications."); return; }
        try {
          const permission = await Notification.requestPermission();
          currentUser.settings.notificationsEnabled = permission === "granted";
          saveCurrentUser();
          render();
          showToast(permission === "granted" ? "Browser notifications are enabled." : "Notification permission was not granted.");
        } catch (error) { showToast("Could not request notification permission."); }
        return;
      }
      if (action === "sign-out") {
        currentUser = null;
        clearInterval(reminderTimer);
        state = structuredClone(starterData);
        authMode = "login";
        authMessage = "";
        renderAuth();
        return;
      }
      if (action === "export-data") {
        const { salt, passwordHash, ...profile } = currentUser;
        const file = new Blob([JSON.stringify({ profile, tasks: state.tasks, habits: state.habits }, null, 2)], { type: "application/json" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(file);
        link.download = `daymark-${currentUser.usernameKey}-backup.json`;
        link.click();
        URL.revokeObjectURL(link.href);
        return;
      }
      if (action === "focus-task") { document.getElementById("task-title")?.focus(); document.getElementById("task-title")?.scrollIntoView({ behavior: "smooth", block: "center" }); return; }
      if (action === "toggle-task") {
        const task = state.tasks.find(item => item.id === id);
        if (task) task.done = !task.done;
      }
      if (action === "toggle-habit") {
        const habit = state.habits.find(item => item.id === id);
        if (habit) habit.history = habitDone(habit) ? habit.history.filter(day => day !== today) : [...habit.history, today];
      }
      if (action === "delete-task") state.tasks = state.tasks.filter(task => task.id !== id);
      if (action === "delete-habit") state.habits = state.habits.filter(habit => habit.id !== id);
      saveState(); render();
    });
    document.addEventListener("submit", async event => {
      if (event.target.id === "signup-form") {
        event.preventDefault();
        try { await registerAccount(event.target); }
        catch (error) { setAuthMessage(error.message || "Could not create this profile."); }
        return;
      }
      if (event.target.id === "login-form") {
        event.preventDefault();
        try { await signIn(event.target); }
        catch (error) { setAuthMessage(error.message || "Could not sign in."); }
        return;
      }
      if (event.target.id === "recover-form") {
        event.preventDefault();
        try { await resetPassword(event.target); }
        catch (error) { setAuthMessage(error.message || "Could not reset this password."); }
        return;
      }
      if (event.target.id === "settings-form") {
        event.preventDefault();
        const form = event.target;
        currentUser.settings.theme = form.elements.theme.value;
        currentUser.settings.taskReminders = form.elements.taskReminders.checked;
        currentUser.settings.reminderTime = form.elements.reminderTime.value || "18:00";
        currentUser.settings.quoteNotifications = form.elements.quoteNotifications.checked;
        currentUser.settings.quoteEveryHours = Number(form.elements.quoteEveryHours.value);
        const notificationChecked = form.elements.notificationsEnabled.checked;
        currentUser.settings.notificationsEnabled = notificationChecked && "Notification" in window && Notification.permission === "granted";
        saveCurrentUser();
        applyTheme(currentUser.settings.theme);
        render();
        showToast(notificationChecked && !currentUser.settings.notificationsEnabled ? "Request browser permission to enable system alerts." : "Settings saved.");
        return;
      }
      if (event.target.id === "task-form") {
        event.preventDefault();
        const input = event.target.elements.title;
        if (input.value.trim()) addTask(input.value);
      }
      if (event.target.id === "habit-form") {
        event.preventDefault();
        const input = event.target.elements.name;
        if (input.value.trim()) addHabit(input.value);
      }
    });
    render();
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch(error => console.error("Daymark offline support could not start.", error));
      });
    }
  </script>
</body>
</html>
